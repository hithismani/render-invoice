# One-click / repo-root: Satori vector PDF. Free plan. No Browser Rendering.
# Paid print-view PDFs: deploy from cf-worker/ (has the [browser] binding).
name = "renderinvoice"
main = "cf-worker/src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
