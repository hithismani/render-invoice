# Local-development variant of wrangler.toml — drops the `[browser]` binding
# because Cloudflare Browser Rendering can't run on `wrangler dev` (it needs
# the real edge runtime; `wrangler dev --remote` is required for that). The
# Satori engine path runs fine locally, which is what `pnpm test:fixtures:worker`
# exercises. Use the main wrangler.toml for actual deploys.
name = "invoicely-render-dev"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
INVOICELY_PRINT_URL = "https://invoicely.app/print-view"
